[pytest]
# ENV-001：统一 pytest 配置，使 AGENTS.md 的 Python 门禁可复现。
asyncio_mode = auto

# TST-001：gRPC async 用例（test_grpc.py）在 pytest 默认的「每测试独立 event loop」
# 下会因 grpc.aio 的异步资源生命周期而挂起；改用 session 级 event loop
# （等价于 test_grpc.py 自带 asyncio.run(main) 的单 loop 跑法）后稳定通过。
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session

addopts = -q

# 防止任何用例静默挂起（整套 Python 基线约数秒，120s 为安全网）。
timeout = 120
timeout_method = thread

# 脚本式测试通过 return 传值（非 pytest 风格），其返回值警告不视为失败。
filterwarnings =
    ignore::pytest.PytestReturnNotNoneWarning
